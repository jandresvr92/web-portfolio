<!doctype html>
<!-- Source of public/images/og/og-image.jpg (1200×630 share card). Edit it here, then
     run `npm run og:build`. Values in double braces are filled from src/lib/site.js. -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #09090b; }
  body { position: relative; font-family: "JetBrains Mono", Consolas, monospace; color: #e4e4e7; }
  .floor {
    position: absolute; left: 50%; top: 50%; width: 2200px; height: 2200px;
    transform: translate(-30%, -50%) rotateX(60deg) rotateZ(-45deg);
    background-image:
      linear-gradient(rgba(255,166,0,.20) 1px, transparent 1px), linear-gradient(90deg, rgba(255,166,0,.20) 1px, transparent 1px),
      linear-gradient(rgba(255,166,0,.09) 1px, transparent 1px), linear-gradient(90deg, rgba(255,166,0,.09) 1px, transparent 1px);
    background-size: 320px 320px, 320px 320px, 64px 64px, 64px 64px;
    background-position: center;
    -webkit-mask-image: radial-gradient(circle at center, black 0%, black 16%, transparent 50%);
  }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 72% 50%, rgba(9,9,11,0) 0%, rgba(9,9,11,.75) 70%); }
  .room { position: absolute; filter: drop-shadow(0 0 22px rgba(0,0,0,.6)); }
  .core { width: 470px; left: 640px; top: 150px; }
  .side { width: 250px; opacity: .9; }
  .stack { left: 905px; top: 18px; }
  .projects { left: 590px; top: 30px; }
  .exp { left: 940px; top: 390px; }
  .text { position: absolute; left: 64px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
  .prompt { color: #ffa600; font-size: 19px; letter-spacing: .02em; }
  .prompt b { color: #71717a; font-weight: 400; }
  h1 { margin-top: 22px; font-size: 64px; line-height: 1.02; font-weight: 700; letter-spacing: -.01em; color: #fafafa; }
  .role { margin-top: 22px; font-size: 25px; font-weight: 500; color: #ffa600; letter-spacing: .04em; }
  .tags { margin-top: 18px; font-size: 19px; color: #a1a1aa; line-height: 1.6; }
  .url { position: absolute; left: 64px; bottom: 44px; font-size: 18px; color: #71717a; }
  .url span { color: #ffa600; }
  .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: #ffa600; }
</style>
</head>
<body>
  <div class="floor"></div>
  <img class="room side projects" src="../../public/images/dioramas/proyectos-v6.webp">
  <img class="room side stack" src="../../public/images/dioramas/stack.webp">
  <img class="room side exp" src="../../public/images/dioramas/experiencia-v2.webp">
  <img class="room core" src="../../public/images/dioramas/sobre-mi-v3.webp">
  <div class="vignette"></div>
  <div class="bar"></div>
  <div class="text">
    <div class="prompt">root@jaime-andres:~$ <b>whoami</b></div>
    <h1>{{NAME_TWO_LINES}}</h1>
    <div class="role">{{ROLE_UPPER}}</div>
    <div class="tags">Angular · React · Node.js · PostgreSQL<br>Data visualization · 3D web</div>
  </div>
  <div class="url"><span>&gt;</span> {{SITE_HOST}}</div>
</body>
</html>
